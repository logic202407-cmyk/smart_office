; ============================================================
; 智慧办公防偷窥人体感知系统 — Phase 1: 最小硬件验证
; ============================================================
; 编译目标: ESP32-S3-DevKitC-1 (N16R8 或其他通用 S3 板)
; 框架: Arduino-ESP32
; 依赖:
;   - U8g2       -> OLED 驱动 (SSD1306 128x64, I2C)
;   - ESP32Servo -> (Phase 2 电机控制预留)
; ============================================================

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.psram_type = qspi
board_upload.flash_size = 8MB

; ---- 分区表：使用默认 4MB 即可 ----
; board_build.partitions = default_4MB.csv

; ---- 依赖库 ----
lib_deps =
    ; OLED 驱动库 (SSD1306 / SH1106 等)
    olikraus/U8g2 @ ^2.34.3
    ; 舵机库 (Phase 2 遮罩电机用，先装好)

; ---- 构建选项 ----
build_flags =
    ; ESP32-S3 USB CDC 启用（bootloader 已正确定址烧录，不再有 WDT）
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; 启用 PSRAM（芯片有 2MB OPI PSRAM）
    -DBOARD_HAS_PSRAM
    -DARDUINO_RUNNING_CORE=1
    ; 调试/日志级别
    -DLOG_LOCAL_LEVEL=4

; ---- 监视器配置 ----
monitor_filters = esp32_exception_decoder, time
